<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- ===== TOPBAR: theme toggle ===== -->
    <div class="topbar">
      <button id="btn-theme" aria-label="Toggle light/dark mode">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">Light Mode</span>
      </button>
    </div>

    <!-- ===== GREETING CARD ===== -->
    <div class="card greeting-card">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date"  class="date"></div>
      <div id="greeting" class="greeting"></div>
    </div>

    <!-- ===== MIDDLE ROW: Timer + Tasks ===== -->
    <div class="row">

      <!-- Focus Timer -->
      <div class="card timer-card">
        <h2 class="card-title">Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="btn-start" class="btn btn-primary">Start</button>
          <button id="btn-stop"  class="btn btn-secondary">Stop</button>
          <button id="btn-reset" class="btn btn-secondary">Reset</button>
        </div>
      </div>

      <!-- To-Do List -->
      <div class="card todo-card">

        <!-- Title + sort control -->
        <div class="todo-header">
          <h2 class="card-title">Tasks</h2>
          <select id="sort-select" class="sort-select" aria-label="Sort tasks">
            <option value="default">Order: Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="pending">Pending First</option>
            <option value="done">Done First</option>
          </select>
        </div>

        <!-- Input row -->
        <div class="todo-input-row">
          <input
            type="text"
            id="todo-input"
            class="todo-input"
            placeholder="Add a new task..."
            maxlength="120"
            autocomplete="off"
          />
          <button id="btn-add-todo" class="btn btn-primary">Add</button>
        </div>

        <!-- Duplicate warning -->
        <p id="todo-warning" class="todo-warning" role="alert" aria-live="polite"></p>

        <!-- Task list -->
        <ul id="todo-list" class="todo-list"></ul>
      </div>

    </div><!-- end .row -->

    <!-- ===== QUICK LINKS ===== -->
    <div class="card links-card">
      <h2 class="card-title">Quick Links</h2>
      <div class="links-input-row">
        <input
          type="text"
          id="link-name-input"
          class="link-input"
          placeholder="Link name"
          maxlength="30"
          autocomplete="off"
        />
        <input
          type="url"
          id="link-url-input"
          class="link-input link-url"
          placeholder="https://example.com"
          maxlength="200"
          autocomplete="off"
        />
        <button id="btn-add-link" class="btn btn-primary">Add Link</button>
      </div>
      <div id="links-list" class="links-list"></div>
    </div>

  </div><!-- end .container -->

  <script src="script.js"></script>
</body>
</html>
